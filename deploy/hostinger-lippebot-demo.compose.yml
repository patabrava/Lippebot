services:
  sarah-backend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: |
      sh -lc '
      apk add --no-cache git >/dev/null &&
      rm -rf /app/repo &&
      git clone --depth 1 https://github.com/patabrava/Lippebot.git /app/repo &&
      printf "%s" "$GOOGLE_APPLICATION_CREDENTIALS_JSON_B64" | base64 -d > /tmp/vertex-adc.json &&
      cd /app/repo/backend &&
      npm ci --include=dev >/dev/null &&
      export GOOGLE_APPLICATION_CREDENTIALS=/tmp/vertex-adc.json &&
      NODE_ENV=production npx tsx src/index.ts
      '
    environment:
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN}
      VERTEX_AI_ENABLED: ${VERTEX_AI_ENABLED}
      VERTEX_AI_PROJECT_ID: ${VERTEX_AI_PROJECT_ID}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION}
      GOOGLE_APPLICATION_CREDENTIALS_JSON_B64: ${GOOGLE_APPLICATION_CREDENTIALS_JSON_B64}
      PIPEDRIVE_API_KEY: ${PIPEDRIVE_API_KEY}
      PIPEDRIVE_PIPELINE_ID: ${PIPEDRIVE_PIPELINE_ID:-1}
      PIPEDRIVE_STAGE_ID: ${PIPEDRIVE_STAGE_ID:-2}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-}
      SERVICE_EMAIL_TO: ${SERVICE_EMAIL_TO}

  sarah-web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - sarah-backend
    command: |
      sh -lc '
      apk add --no-cache git >/dev/null &&
      rm -rf /app/repo &&
      git clone --depth 1 https://github.com/patabrava/Lippebot.git /app/repo &&
      cd /app/repo/widget &&
      npm ci >/dev/null &&
      npm run build >/dev/null &&
      cp /app/repo/deploy/widget-test-index.html /app/repo/widget/dist/index.html &&
      cd /app/repo &&
      npm init -y >/dev/null 2>&1 &&
      npm i express http-proxy-middleware >/dev/null 2>&1 &&
      node /app/repo/deploy/widget-proxy-server.cjs
      '
    ports:
      - "8085:8080"
